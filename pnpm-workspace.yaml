packages:
  - apps/*
  - packages/*

# pnpm 10 n'exécute pas les scripts d'installation des dépendances par défaut.
# Seuls les paquets listés ici y sont autorisés (moteurs Prisma, binaires natifs).
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - esbuild
  - sharp
  - unrs-resolver
  - '@nestjs/core'

# Correctifs de sécurité de dépendances transitives (pnpm audit), limités à
# leur parent. Prisma 7.10.0 (dernière version stable) fige ces versions
# vulnérables ; à retirer dès qu'une version de Prisma les met à jour.
overrides:
  # GHSA-ggr8-5vv4-36mx (élevée) : seule la fonction deepmerge() est utilisée,
  # inchangée en v8 (les changements cassants portent sur deepmergeInto et des types).
  '@prisma/config>deepmerge-ts': ^8.0.2
  # GHSA-3f6p-5ww8-9rcr (élevée) et GHSA-rgwj-5xj2-c3m3 (modérée) : même version majeure.
  'prisma>mysql2': ^3.24.5

# Exceptions d'audit ciblées, chacune à retirer dès qu'une version corrigée sera publiée.
# pnpm ne sait ignorer un avis que globalement (par identifiant GHSA) : le chemin
# accepté est documenté ci-dessous et vérifiable par `pnpm why <paquet> -r`.
auditConfig:
  ignoreGhsas:
    # braces (élevée) : aucun correctif publié (toutes les versions <= 3.0.3 sont
    # concernées). Utilisé uniquement par l'outillage ESLint de développement
    # (eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch),
    # avec des motifs fixés par le projet ; absent des dépendances de production.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js (modérée, CVE-2026-97058) : déni de service par des spécificateurs de
    # précision non bornés ; aucun correctif publié (toutes les versions <= 1.1.3).
    # Seul chemin accepté : apps__api > mammoth > argparse > sprintf-js (1.0.3).
    # Mammoth 1.13.0 (dernière version) dépend toujours de argparse ~1.0.3, qui ne
    # sert qu'à son outil en ligne de commande (bin/mammoth). WordFix n'utilise que
    # la bibliothèque (convertToHtml, extraction de secours des .docx) : argparse et
    # sprintf-js ne sont jamais chargés, et aucune chaîne de format ne provient d'un
    # utilisateur. À réexaminer si ce paquet apparaît par un autre chemin.
    - GHSA-hp3w-g68c-fv3c
